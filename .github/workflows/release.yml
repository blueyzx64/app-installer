# F-62 build + smoke + pre-release. F-64 signing runs only when secrets exist.
name: Release

on:
  push:
    tags: ['v*']
  # Manual run: builds the current commit and creates the tag v<Cargo version> on it.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Tag push: the tag itself. Manual run: v<Cargo version>, created by the publish job.
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
  CARGO_TERM_COLOR: always
  PNPM_VERSION: '10.28.0'

jobs:
  build:
    name: Build RPM and AppImage (fedora:44)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    # Oldest supported release: fixes the glibc and WebKitGTK floor (ADR-0008).
    container: fedora:44
    env:
      # linuxdeploy needs FUSE; containers have none, so unpack and run instead.
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'
    steps:
      - name: Install build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc gcc-c++ make pkgconf-pkg-config curl file patchelf xdg-utils \
            rpm-build rpm-sign cpio gnupg2 \
            nodejs npm \
            webkit2gtk4.1-devel gtk3-devel dbus-devel openssl-devel librsvg2-devel libsoup3-devel \
            desktop-file-utils appstream
      - uses: actions/checkout@v4.2.2
      - name: Check tag matches Cargo version
        id: version
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          tag="${RELEASE_TAG:-v${version}}"
          test "v${version}" = "${tag}" || { echo "tag ${tag} != Cargo version v${version}"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build bundles
        run: pnpm tauri build --bundles rpm,appimage
      - name: Validate metainfo
        run: |
          # Only known pedantic note: the placeholder id has capitals (ASK O: rename id).
          out=$(appstreamcli validate --pedantic --no-net src-tauri/linux/io.github.blueyzx64.Installer.metainfo.xml || true)
          echo "$out"
          ! echo "$out" | grep -E '^[EWI]:'
      - name: Validate desktop file
        run: |
          desktop=$(rpm -qlp src-tauri/target/release/bundle/rpm/*.rpm | grep '\.desktop$' | head -n1)
          rpm2cpio src-tauri/target/release/bundle/rpm/*.rpm | cpio -idmv --quiet ".$desktop"
          desktop-file-validate ".$desktop"
      - name: Inspect RPM
        run: |
          rpm=$(ls src-tauri/target/release/bundle/rpm/*.rpm)
          rpm -qlp "$rpm"
          rpm -qRp "$rpm"
          rpm -qRp "$rpm" | grep -q PackageKit
          rpm -qlp "$rpm" | grep -q '\.desktop$'
          rpm -qlp "$rpm" | grep -q 'metainfo\.xml$'
      - name: Sign RPM (F-64, skipped without secrets)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.RPM_GPG_KEY_ID }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY}" ] || [ -z "${GPG_KEY_ID}" ]; then
            echo "No signing key configured. Skipping RPM signing."; exit 0
          fi
          printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          printf '%%_gpg_name %s\n%%__gpg_sign_cmd %%{__gpg} gpg --batch --no-armor --pinentry-mode loopback --no-tty -u "%%{_gpg_name}" -sbo %%{__signature_filename} %%{__plaintext_filename}\n' "${GPG_KEY_ID}" > "$HOME/.rpmmacros"
          for f in src-tauri/target/release/bundle/rpm/*.rpm; do
            rpmsign --addsign "$f"
            rpm -K "$f"
          done
          gpg --armor --export "${GPG_KEY_ID}" > src-tauri/target/release/bundle/rpm/RPM-GPG-KEY-installer
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/RPM-GPG-KEY-installer
            src-tauri/target/release/bundle/appimage/*.AppImage

  smoke:
    name: Install RPM on fedora:45
    needs: build
    runs-on: ubuntu-24.04
    container: fedora:45
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: bundles
          path: bundles
      - name: Install the RPM
        run: dnf install -y ./bundles/rpm/*.rpm desktop-file-utils
      - name: Check signature when signed
        run: |
          if [ -f bundles/rpm/RPM-GPG-KEY-installer ]; then
            rpm --import bundles/rpm/RPM-GPG-KEY-installer
            rpm -K bundles/rpm/*.rpm | grep -qi 'signatures OK'
          fi
      - name: Check the installed files
        run: |
          test -x /usr/bin/installer
          desktop=$(rpm -ql installer | grep '\.desktop$' | head -n1)
          desktop-file-validate "$desktop"
          grep -q '^MimeType=.*application/x-rpm' "$desktop"
          grep -Eq '^Exec=.* %f$' "$desktop"

  publish:
    name: Publish GitHub pre-release
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: bundles
          path: bundles
      - uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          # Not yet verified on real Fedora 45 hardware (docs/VERIFICATION.md).
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            bundles/rpm/*
            bundles/appimage/*.AppImage
