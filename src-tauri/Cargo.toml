[workspace]
members = [".", "crates/*"]
resolver = "3"

[package]
name = "installer"
version = "0.1.0"
description = "Drag-to-Applications installer for Linux"
edition = "2024"
rust-version = "1.85"
default-run = "installer"

[lib]
name = "installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "installer"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
anyhow = "1"
