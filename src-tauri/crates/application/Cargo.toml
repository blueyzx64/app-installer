[package]
name = "installer-application"
version = "0.1.0"
edition = "2024"
publish = false
description = "Use cases and port traits for the installer. No IO."

[features]
# Fakes for every port, for use-case tests here and in other crates.
testing = []

[dependencies]
installer-domain.workspace = true
tracing.workspace = true
trait-variant.workspace = true
# CancellationToken only (tokio-util::sync). No runtime is started here.
tokio-util.workspace = true

[dev-dependencies]
installer-application = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
