[package]
name = "installer-infrastructure"
version = "0.1.0"
edition = "2024"
publish = false
description = "Adapters that implement the application ports (PackageKit, AppImage, GIO, ...)."

[dependencies]
installer-domain.workspace = true
installer-application.workspace = true
gio = "0.18" # lane S3b
serde_json.workspace = true # lane S3b
# Lanes B and C add zbus, backhand, rpm, gio, ashpd, tokio, serde_json here.

[dev-dependencies]
tempfile = "3" # lane S3b
tokio = { workspace = true, features = ["rt", "macros"] } # lane S3b
