[package]
name = "installer-infrastructure"
version = "0.1.0"
edition = "2024"
publish = false
description = "Adapters that implement the application ports (PackageKit, AppImage, GIO, ...)."

[dependencies]
installer-domain.workspace = true
installer-application.workspace = true
# lane S2 (PackageKit)
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
futures-util = { version = "0.3", default-features = false }
tracing.workspace = true
# Lanes B and C add zbus, backhand, rpm, gio, ashpd, tokio, serde_json here.

[dev-dependencies]
installer-application = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "test-util"] }
