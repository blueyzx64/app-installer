[package]
name = "installer-infrastructure"
version = "0.1.0"
edition = "2024"
publish = false
description = "Adapters that implement the application ports (PackageKit, AppImage, GIO, ...)."

[dependencies]
installer-domain.workspace = true
installer-application.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "fs"] }
futures-util = { version = "0.3", default-features = false }
# lane S2 (PackageKit) + lane S2c (dnf5daemon)
zbus = { version = "5", default-features = false, features = ["tokio"] }
# lane S2b (rpm/deb inspection)
rpm = { version = "0.30.2", default-features = false, features = ["gzip-compression", "xz-compression", "zstd-compression"] }
flate2 = "1.1.10"
liblzma = "0.4.9"
zstd = "0.14.3"
# lane S3 (AppImage, desktop entries, launcher) + lane S3b (defaults)
backhand = "0.25"
gio = "0.22"
gio-unix = "0.22"
glib = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
# lane S2c
trait-variant = { workspace = true, optional = true }

[features]
# lane S2c
dnf5daemon = ["dep:trait-variant"]

[dev-dependencies]
installer-application = { workspace = true, features = ["testing"] }
tempfile = "3"
tokio = { workspace = true, features = ["sync", "macros", "rt", "rt-multi-thread", "time", "test-util", "fs"] }
# lane S2b: builds tiny .rpm fixtures in tests
rpm = { version = "0.30.2", default-features = false, features = ["payload", "gzip-compression", "xz-compression", "zstd-compression"] }
